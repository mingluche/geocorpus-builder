[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geocorpus-builder"
version = "0.1.0"
description = "Build, validate, and query geographically grounded Earth-science corpora"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "pyarrow>=10.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
rag = ["anthropic>=0.30.0", "openai>=1.0"]
spatial = ["geopandas>=0.14", "shapely>=2.0", "rasterio>=1.3", "xarray>=2024.1", "netcdf4>=1.6", "scipy>=1.10"]
gui = ["streamlit>=1.28"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1.0"]

[project.scripts]
geocorpus = "geocorpus_builder.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["geocorpus_builder*"]

[tool.setuptools.package-data]
geocorpus_builder = ["data/*"]
